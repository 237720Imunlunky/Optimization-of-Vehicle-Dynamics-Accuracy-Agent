name: windows-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - name: Install pytest
        run: python -m pip install pytest==8.4.2
      - name: Install python-can
        run: python -m pip install python-can==4.6.1
      - name: Install cantools
        run: python -m pip install cantools==43.0.0
      - run: python scripts/check_public_release.py
      - run: python -m pytest -q
        working-directory: 项目实现
      - run: python -m llm_optimizer.run_agent --dry-run --output "输出/CI/dry_run"
        working-directory: 项目实现
